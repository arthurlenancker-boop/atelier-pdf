# CI d'Atelier PDF : le moteur doit rester vert sous Node sur Windows,
# la plateforme de livraison, avant toute fusion.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install (et non npm ci) : le package-lock généré hors Windows
      # omet des paquets optionnels win32 — leçon du lanceur (PR #9).
      - name: Installation des dépendances
        run: npm install --no-audit --no-fund

      - name: Tests du moteur (node --test)
        # En cas d'échec, l'extrait du journal est publié en annotation
        # (lisible sur la page publique des vérifications du commit).
        shell: bash
        run: |
          set +e
          sortie=$(npm test 2>&1)
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            extrait=$( { echo "$sortie" | tr -d '\r' | grep -A 14 'not ok' ; echo "$sortie" | tr -d '\r' | grep -E '^# (tests|pass|fail|cancelled)' ; } | tr '\n' '|' | sed 's/::/;/g' | head -c 14000 )
            extrait=${extrait//%/%25}
            total=${#extrait}
            i=0
            while [ "$i" -lt "$total" ] && [ "$i" -lt 13500 ]; do
              printf '::error::%s\n' "${extrait:$i:1500}"
              i=$((i+1500))
            done
            exit 1
          fi

      - name: Contrôle des licences des dépendances
        run: node scripts/check-licenses.js

      # Prototype OCR (branche vibe/proto-ocr) : l'échantillon produit par
      # le test (sortir/scan-ocr.pdf) est publié comme artefact de la
      # vérification, téléchargeable depuis la page du run.
      - name: Artefact du prototype OCR
        if: github.ref == 'refs/heads/vibe/proto-ocr'
        uses: actions/upload-artifact@v4
        with:
          name: scan-ocr-demo
          path: |
            sortir/scan-ocr.pdf
            sortir/rapport-ocr.json
          if-no-files-found: ignore
          retention-days: 30
