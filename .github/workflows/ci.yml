# CI d'Atelier PDF : le moteur doit rester vert sous Node sur Windows,
# la plateforme de livraison, avant toute fusion.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install (et non npm ci) : le package-lock généré hors Windows
      # omet des paquets optionnels win32 — leçon du lanceur (PR #9).
      - name: Installation des dépendances
        run: npm install --no-audit --no-fund

      # v0.1.22 : le modèle de langue de l'OCR voyage en base64 dans le
      # dépôt ; les tests tesseract attendent le vrai binaire décodé.
      - name: Préparation du modèle OCR (décodage base64)
        run: node scripts/preparer-ocr.js

      - name: Tests du moteur (node --test)
        # En cas d'échec, l'extrait du journal est publié en annotation
        # (lisible sur la page publique des vérifications du commit).
        shell: bash
        run: |
          set +e
          sortie=$(npm test 2>&1)
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            extrait=$( { echo "$sortie" | tr -d '\r' | grep -A 14 'not ok' ; echo "$sortie" | tr -d '\r' | grep -E '^# (tests|pass|fail|cancelled)' ; } | tr '\n' '|' | sed 's/::/;/g' | head -c 14000 )
            extrait=${extrait//%/%25}
            total=${#extrait}
            i=0
            while [ "$i" -lt "$total" ] && [ "$i" -lt 13500 ]; do
              printf '::error::%s\n' "${extrait:$i:1500}"
              i=$((i+1500))
            done
            exit 1
          fi

      # v0.1.25 : le serveur OCR personnel est éprouvé à chaque poussée :
      # son banc d'essai (bibliothèque standard seule, mode --banc) vérifie
      # le contrat /ocr, y compris le jeton (200/401 sans, avec et contre
      # l'en-tête Bearer) et la rétrocompatibilité sans jeton.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test serveur OCR (mode banc)
        shell: bash
        run: python serveur-ocr/test_serveur.py

      # v0.1.28 : le moteur de reconnaissance des pages est éprouvé à
      # chaque poussée (schéma strict MinerU 4.x, bbox, types, tableaux,
      # formules ; le banc d'intégration embarque un moteur factice,
      # aucune dépendance lourde sur le runner).
      - name: Test du moteur de pages OCR (python)
        shell: bash
        run: python serveur-ocr/test_moteur_pages.py

      - name: Contrôle des licences des dépendances
        run: node scripts/check-licenses.js
