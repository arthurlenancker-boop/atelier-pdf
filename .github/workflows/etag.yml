# Livraison automatique : ce fichier, poussé sur main, construit et publie la
# version declare dans package.json (tag vX.Y.Z pose au passage si absent).
# Necessaire car ni le connecteur GitHub ni l'application mobile ne savent
# creer une etiquette, et l'ordinateur d'Arthur n'a pas npm. Les etiquettes
# posees par GITHUB_TOKEN ne declenchent pas d'autre flux (regle GitHub),
# d'ou un flux unique autonome qui enchaine tout.
# Attention : ce flux se declenche a CHAQUE modification de ce fichier.
# Declencheur de la v0.1.41 : l'outil Modifier, croquis VALIDE par
# Arthur (« c'est carré ça »). Demande : « pose moi des questions pour
# savoir ce qu'il faut faire concernant la modification du texte
# (l'interface) ». Reponses d'Arthur entrevues en deux tours : le texte
# s'edite EN PLACE comme dans Word (pas de grande boite ; l'actuelle
# est « trop grande, trop voyante »), rendu « comme OneNote » (une
# leger teinte de fond sur la zone en edition, rien de plus),
# validation « la touche entree », le texte ajoute prend « exactement
# la meme » mise en forme, et APRES la premiere maquette (suppression
# interdite) Arthur a ecrit « je ne peux pas supprimer de
# texte... » : la maquette corrigee autorise la suppression et le
# remplacement, l'outil s'appelle Modifier. Construction SANS toucher
# au moteur d'ecriture du PDF (la correction v0.1.38/39 est le socle
# exact) : (1) engine/textereel.js, moteur pur, gagne deux fonctions
# TESTEES, ligneAuPoint (la ligne cliquee, a la bande verticale pres,
# rayon borne : un demi-corps vertical, max(10 ; 1,5 corps)
# horizontal pour cliquer en fin de ligne) et zoneDeLigne (source,
# taille, famille, gras et rectangle d'UNE ligne, memes dominantes
# qu'analyserItemsTexte sans fusionner le paragraphe) ;
# (2) renderer/index.html : bouton « Modifier » a cote d'Écrire ;
# (3) renderer/style.css : le cadre de correction abandonne la boite
# blanche — teinte rgba(0,103,192,.07), lisere 1 px rgba(0,103,192,.35),
# aucun halo ; (4) renderer/app.js : ouvrirModificationAuPoint (reprise
# de la correction posee au point, sinon la ligne cliquee du VRAI texte,
# sinon le bloc reconnu d'un scan, sinon un message d'orientation ; le
# chemin du bloc reconnu est PARTAGE avec le clic de l'aperçu Reco,
# ouvrirCorrectionDeBloc), le caret part du caractere le plus proche du
# clic, padding vertical nul sur la correction (texte cale sur
# l'original), et l'etiquette clavier du croquis : dans UNE correction,
# Entree POSE, Maj+Entree (ou Ctrl+Echap) passe la ligne, Echap
# ABANDONNE et rend l'original intact ; les autres cadres (notes,
# fiches) gardent leur etiquette v0.1.21 (Echap pose). Tests :
# textereel.test.js passe de 7 a 10 tests (ligne sous le point, bornes
# des marges, zone d'une ligne) ; 291 tests au total attendus verts.
# Declencheur de la v0.1.40 : retour d'Arthur — « essaie de revoir le
# code pour les modifications pour qu'il soit comme je le pense ».
# Revue du code des annotations riches contre la maquette VALIDEE
# (demo-couleurs-formes-texte) : tout est conforme (formes de
# surlignage et de cadre, traits, epaisseurs, teinte, cercle
# chromatique, machine a ecrire riche, reprise, redimensionnement)
# SAUF deux manques livres depuis la v0.1.31 : (1) la palette
# « Couleur du texte » du panneau Ecrire existait VIDE — la section
# etait dans index.html mais aucune pastille n'y etait jamais ajoutee
# et aucun geste ne colorait le texte, alors que la maquette validée
# offrait sept couleurs, la pastille personnalisee et le cercle
# chromatique, et que le moteur compose deja les spans colorés
# (riche.test.js #D13438) ; (2) les boutons de mise en forme cliques
# SANS note ouverte s'illuminaient en annoncant « armer le style de
# la prochaine saisie » mais l'armement n'etait relu nulle part :
# cliquer Gras puis ecrire ne produisait PAS de gras, contrairement a
# la maquette. Correctif SANS toucher au moteur ni au format des
# fichiers, rendu et UI seulement (renderer/app.js) : la palette
# sw-ecrire est peuplee comme les autres (sept couleurs + pastille
# personnalisee + cercle chromatique partage), la couleur s'applique
# a la selection de l'editeur ouvert par foreColor en span de style
# (le serialiseur et le moteur le posent tel quel), ou s'ARME pour
# la prochaine note ; l'armement des styles est desormais un VRAI
# etat (etat.options.ecrire.styles) et l'ouverture d'une note NEUVE
# rejoue les styles et la couleur armes au depart de la saisie — la
# reprise d'une note posee garde sa mise en forme propre, rien n'y
# est rearme. Aucun changement du moteur : les 288 tests restent
# inchanges (seul le rendu bouge ; syntaxe verifiee node --check).
# Declencheur de la v0.1.39 : retour d'Arthur — « c'est ça aussi qui me
# gene une boite s'ouvre et ce n'est pas utile pour modifier » avec
# captures : sur une page a texte reel, l'editeur de correction
# s'ouvrait mais la pose ECHOUAIT, toast brut « WinAnsi cannot encode
# (0x000a) ». Cause etablie dans la source : pdf-lib refuse de MESURER
# tout caractere hors WinAnsi, y compris le retour a la ligne ; sur une
# page a texte reel la source preremplie joint les lignes par \n
# (l'OCR aussi), composerLignes (engine/texte.js) traitait ce \n comme
# un simple espace, la mesure rejetait donc la pose ENTIERE ; la
# reprise (annotation retiree puis reposee) echouant, la correction
# disparaissait et « le texte restait tel qu'il etait ». Correctif :
# (1) composerLignes coupe desormais sur /\r?\n/ : chaque saut de
# ligne devient un retour a la ligne REEL dans l'apparence ; (2) les
# moteurs de pose (correction, melange, riche) mesurent le texte
# AFFICHE, translittere puis assaini (sanitizeWinAnsi de
# engine/annotcore.js) : la mesure ne rejette PLUS jamais la pose, et
# un caractere exotique (Ω, émoji) s'affiche « ? » sans rien casser ;
# (3) la source, dans /Contents, reste exacte. Tests :
# test/texte.js 23 (dont la mesure qui JETTE bien sur \n comme pdf-lib,
# la composition en lignes reelles), test/correction.test.js 12
# (pose multi-lignes en 2 lignes reelles, source relue exacte,
# caracteres exotiques). 288 tests.
# Declencheur de la v0.1.38 : retour d'Arthur — « quand je modifie le
# texte ca forme un amas de texte et apres les modifications ne
# s'appliquent pas et le texte reste tel qu'il etait » puis « le test
# modifie la police ». Cause etablie dans la source : la correction en
# place (v0.1.29) fut concue pour les SCANS ; appliquee a une page a
# TEXTE REEL (nee sous Word, LibreOffice, PowerPoint), elle estime la
# taille de l'image de reconnaissance et reecrit tout en Helvetica
# uniforme : police changee, style perdu, et une formule que MathJax
# ne peut pas rendre faisait ECHOUER la pose entiere (« les
# modifications ne s'appliquent pas », annot retire puis jamais
# reposee). Correctif SANS changer le format des fichiers : (1) nouveau
# moteur pur engine/textereel.js : le vrai texte de la page est lu par
# pdf.js (fragments + styles), la correction repart de la source
# reelle, de la TAILLE reelle mesuree sur place, de la FAMILLE reelle
# (serif -> police Times, sinon Helvetica) et du gras au besoin ;
# (2) la famille et le gras voyagent dans le marqueur /Contents
# (« Correction OCR <taille> <serif|sans> [gras] : », anciens marqueurs
# relus), donc la reprise, le deplacement et le redimensionnement
# reposent la correction dans SA police (engine/bouger.js) ; (3) une
# formule non rendable s'ecrit en texte translittere : la pose
# reussit TOUJOURS (engine/correction.js) ; (4) le fichier de
# reconnaissance reste maitre sur les pages scanned muettes.
# Tests : test/textereel.test.js (7), test/correction.test.js etendu
# (2 nouveaux + marqueur famille/gras). 284 tests.
# Declencheur de la v0.1.37 : retour d'Arthur — « je ne peux
# plus cocher la case scan » (bouton Reco de la barre d'outils,
# grisé). Cause etablie dans la source : l'etat des options OCR
# du rendeur naissait au mode « mistral » par defaut et n'etait
# relu NI au demarrage, NI a la validation de la carte (seule
# l'ouverture de Fichier → Options OCR LaTeX… le rafraichissait) :
# la reconnaissance du document a l'ouverture (v0.1.28) repartait
# aussitot, aucune page n'avait de blocs reconnus, et le bouton
# Reco restait grise en silence apres chaque lancement. Correctif
# SANS changer le fichier PDF : (1) les options memorisees sont
# relues au DEMARRAGE du rendeur (init) ; (2) la validation de la
# carte actualise l'etat aussitot (validerOptionsOcr) ; (3) un
# bouton grisé EXPLIQUE sa cause au survol (serveur non configure
# ou page pas encore reconnue, majRecoVue) ; la garde demenagee en
# fonction pure testable engine/ocr.js reconnaissanceServeurActif
# (test/ocr.test.js, 2 tests). 272 tests.
# Declencheur de la v0.1.36 : retour d'Arthur — « quand j'appuie
# pour modifier une note, c'est possible de modifier avec la mise
# en forme reconnue et pas avec cet amas de caracteres ? ». Cause
# etablie : la note riche stocke sa mise en forme dans une source
# canonique (sous-ensemble HTML + $formules$), composee a la pose
# par le moteur ; mais le cadre d'edition y rejettait la source SANS
# composer les formules : la reprise d'une note de maths montrait
# le code LaTeX brut entre dollars, « un amas de caracteres ».
# Correctif SANS CHANGER LE FICHIER : (1) chaque formule se compose
# en image (ops de l'apercu, tracerOpsPlacé, dataURL) alignee sur
# la ligne de base par vertical-align negatif de la profondeur,
# geometrie pure engine/markup.js cadrerImageFormule ; (2) a la
# reprise, habillerFormulesEditeur remplace chaque $...$ par son
# image composee, parcours asyncrone prudent (cadre referme, onglet
# change ou texte modifie = arret net, echec = code visible en
# repli) ; (3) l'insertion depuis le panneau Equation pose l'image
# au curseur, double-clic sur une formule = correction puis
# « Remplacer la formule » en place ; (4) le SEerialiseur restitue
# chaque image en $...$ brut : source canonique, journal
# d'annulation, autres lecteurs et tests d'aller-retour INTACTS ;
# une note reduite a ses formules reste posable (garde de vide sur
# la source, contientFormule). 270 tests.
# Declencheur de la v0.1.35 : retour d'Arthur — « ca ne retire
# pas vraiment, et regarde les dingueries que fait l'ocr ».
# Cause etablie (banc node, pdfjs-dist 4.10.38, PDF forge par
# pdf-lib) : DEUX sources de verite peignaient l'ecran. Le calque
# applicatif (dessinerAnnots) vidait bien le surlignage supprime,
# mais pdf.js repeignait AUSSI les apparences des annotations
# dans le canevas de page (annotationMode implicite ENABLE) :
# le surlignage d'origine restait au fond, « un retrait qui ne
# se voit pas ». Trois volets : (1) rendu principal en
# annotationMode DISABLE (renderer/app.js rendPage — vignettes
# et captures inchanges, aucun calque par-dessus) ; (2) l'encre
# redessinee par le calque depuis /InkList relu (engine/reread.js
# champ inkList, couleur /C, epaisseur /BS W) et liseré gris pour
# les annotations tierces visibles (Line, PolyLine, Polygon,
# Stamp, Caret, FileAttachment, Redact) ; (3) menu Edition
# « Oter tous les surlignages de la page » : moteur pur
# engine/surlignage.js, les quatre formes (surlignage, souligne,
# barre, ondule), UN lot = UN geste annulable. Les blocs en
# pointilles signales a cote sont l'affichage des blocs
# reconnus par l'OCR (calque « Reco », masquable au bouton) et
# la selection : jamais inscrits dans le fichier. 267 tests.
# Declencheur de la v0.1.34 : retour d'Arthur — « il n'y a plus de
# raccourci qui se cree apres installation ». Cause etablie : la
# v0.1.33 n'a pas ete installee a la main, elle l'a ete EN SILENCE
# par electron-updater (drapeau --updated) : l'installateur n'y
# recree AUCUN raccourci et la desinstallation de l'ancienne version
# emporte l'existant (electron-builder #2725, #2514). Deux volets :
# package.json nsis explicite (createDesktopShortcut « always »,
# createStartMenuShortcut, shortcutName « Atelier PDF ») et GARANTIE
# DANS L'APPLICATION : a chaque lancement empaquete sous Windows,
# main.js recree les raccourcis manquants du bureau et du menu
# demarrer (engine/raccourcis.js, moteur pur ; un raccourci present
# n'est jamais retouche, bureau OneDrive honore, echec silencieux).
# 261 tests verts.
# Declencheur de la v0.1.33 : retour d'Arthur — « j'ai trop cette
# erreur pour bien travailler » (Le rejeu du geste n° 8 a echoue :
# Annotation introuvable, en boucle). Cause racine : les canaux IPC
# n'etaient pas serialises ; deux Ctrl+Z rapproches pendant un
# rejeu long ouvraient deux annulations qui chevauchaient, depilaient
# deux fois le meme journal, et le document ne correspondait plus
# jamais au journal : chaque annulation ulterieure echouait
# definitivement. Trois volets : engine/synchro.js (file de commandes
# a exclusion mutuelle, FIFO strict, isolement des erreurs) ; main.js
# enqueue pdf:apply/pdf:undo/pdf:redo/pdf:save, l'etat vise capte a
# l'arrivee de la commande (changement d'onglet sans detournement) ;
# reprise assuree sur un journal deja derive (engine/undo.js
# rejouerPrefixeSain : depaie par la fin jusqu'au dernier prefixe
# rejouable, l'annulation rend toujours la main) et repose sure dans
# engine/bouger.js (la source embarquee se valide AVANT le retrait,
# l'annotation d'origine est reinseree si la pose echoue : plus
# jamais une note perdue sur un contenu corrompu). 257 tests.
# Declencheur de la v0.1.30 : onglets et « enregistrer avant la
# fermeture ». Chaque PDF ouvert vit dans son onglet (bande sous la
# barre du haut : clic = bascule, croix = fermeture, Ctrl+W = fermer
# l'onglet actif) ; l'etat complet de chaque document (session pdf-lib,
# journal des gestes, drapeau modifie) demeure dans le processus
# principal (Map des onglets, pdf:active bascule le pointeur), le
# rendu reaffiche depuis le resume et garde par onglet sa vue (page,
# zoom, mots reconnus). Ouvrir un fichier deja present REACTIVE son
# onglet, jamais un second exemplaire. La croix d'onglet, la croix de
# fenetre, Alt+F4 et Quitter demandent tous (boite native
# Enregistrer / Fermer sans enregistrer / Annuler) AVANT de perder un
# document modifie ; Corps en colonne flexible (lecon v0.1.16 : la
# bande d'onglets ne decale plus jamais la zone de travail).
# Declencheur de la v0.1.32 : retour d'Arthur en essai reel v0.1.30 —
# « je voulais mettre delta ». La zone d'equation structuree ne
# composait RIEN sur la barre d'espace (MathLive n'insere rien en mode
# math, et le mode commande LaTeX ne se quitte QUE par Echap) : \delta
# puis Espace resteait une commande en texte droit, d'ou la capture.
# Depuis la v0.1.32, un appui d'espace dans le mode commande (mf.mode
# 'latex') compose la formule et revient au mode math : \delta/Espace
# donne delta, parite OneNote ; la palette Grecques porte l'alphabet
# complet (epsilon, varepsilon, zeta, eta, iota, kappa, nu, xi, tau,
# upsilon, chi, psi, Gamma, Theta, Lambda, Xi, Phi, Psi, vartheta,
# varphi en plus d'alpha, beta, gamma, delta, Delta, Omega, omega, mu,
# pi, rho, sigma, Sigma, lambda, phi). Decision police Fermee et
# documentee : MathLive cable KaTeX en dur, MathJax 3.2.2 ne distribue
# aucune donnee STIX (verifie, pas meme la beta v4) : l'aspect
# typographique libre reste distinct de OneNote (Cambria Math
# proprietaire).
# REPARATION de dernier recours (motif v0.1.27) : le flux des
# annotations riches s'etait arrete sur main ROUGE (CI #69 et
# Livraison #41 echoues, aucun commit depuis 18:05Z). La branche
# translaterLigne de engine/bouger.js pour l'opcode c etait placee
# APRES le garde "nombreMots inconnu -> ligne intacte", d'ou des
# cubiques jamais translatees ; et le test bouger.test.js convertissait
# l'opcode "c" par Number (NaN) : l'assertion ne pouvait jamais passer.
# Les DEUX sont corriges (branche deplacee AVANT le garde ; slice(0, 6)
# avant map(Number)) : leur travail v0.1.31 est livre tel quel avec,
# 250 tests verts.
# Declencheur de la v0.1.31 : annotations riches validees sur maquette
# canvas par Arthur (croquis couleurs, formes et traitement de texte).
# Chaque outil Surligner, Encadrer et Ecrire ouvre son panneau d'options
# a gauche de la page : Surligner gagne quatre formes (/Highlight plein,
# /Underline soulignement, /StrikeOut barre, /Squiggly onde) et huit
# couleurs ; Encadrer quatre formes (rectangle, arrondi, ellipse, nuage
# /Cloudy), trois traits (continu, tirets [7 5], points [0.2 6]), trois
# epaisseurs (1.3 / 2.2 / 3.4 pt), remplissage teinte a 13 % et sept
# couleurs ; Ecrire devient machine a ecrire riche — taille de corps
# 8 a 36 pt, gras, italique, souligne, barre, exposant, indice, couleur
# du texte et de fond (opacite 0.6), alignements, listes a puces et
# numeros, formules $...$ composees par MathJax. Chaque palette offre
# le cercle chromatique HSV pour les couleurs personnalisees
# (engine/couleurs.js). Le texte riche se compose par engine/markup.js
# et se pose par engine/riche.js (/FreeText, marqueur « Note riche
# taille : ») ; les cadres portent leur forme dans le /Subject (« Cadre
# forme,trait,epaisseur[,teinte] ») et l'apparence est genere par
# engine/annots.js ; le deplacement et le redimensionnement (poignee
# bas-droite) reposent la note ou le cadre a l'identique
# (engine/bouger.js ; le rendu ecran suit dans renderer/app.js,
# options dans renderer/index.html et style dans renderer/style.css).
# L'outil Trait (encre) reste hors du panneau d'options.
# Relance 1 (apres echec CI des tests moteur) : l'opcode c prend SIX
# nombres (SEPT mots) — translaterLigne comptait huit nombres, d'ou des
# cubiques d'ellipse jamais translatees ; le test riche eprouve /Gf avec
# un vrai fond coloré dans sa source (l'ancienne source n'en avait pas).
# Declencheur de la v0.1.29 : page reconnue editable en place (geste
# valide sur maquette canvas par Arthur). Les blocs reconnus de la page
# affichee apparaissent en contour discret a l'outil Selection ; un clic
# ouvre la correction EXACTEMENT a sa place, preremplie du texte reconnu,
# a la taille estimee du bloc (les formules en LaTeX $...$, composees
# par le moteur d'equations). A l'enregistrement, engine/correction.js
# COUVRE le scan du bloc d'un rectangle blanc opaque et ecrit le texte
# vectoriel standard (engine/texte.js porte le marqueur Correction OCR ;
# engine/bouger.js repose la correction au redimensionnement ; le bouton
# Reco masque l'apercu pour saisir les annotations posees).
# Declencheur de la v0.1.28 : barre de progression de la reconnaissance
# du document a l'ouverture (styles A et D valides par Arthur sur la
# maquette canvas : barre fine sous la barre d'outils, navette pendant
# le chargement du moteur, etats des vignettes, lien Arreter discret),
# reconnaissance sequentielle par le chemin central page:tester, pages
# reconnues gardees en memoire (rien n'ecrit dans le PDF). Correctifs
# approuves livres ensemble : refus de https:// sur un hote local
# (estHttpsLocal + message clair dans la carte des options), aide
# « un document doit etre ouvert » dans la carte, styles propres au
# bloc #essai-page, silence des reinitialisations de connexion
# (WinError 10054) du serveur OCR, test_moteur_pages.py dans la CI.
# Historique v0.1.27 : remise en coherence apres croisement de deux
# flux le meme matin (correctifs Equation prepare sur une base v0.1.24
# pendant que main avancait : restauration des quatre fichiers ecrases,
# garde-fous de livraison retrouves, version 0.1.27 ; les versions
# 0.1.25 et 0.1.26 etaient restees livrees par le flux serveur).
# Pour livrer une nouvelle version : incrementer "version" dans
# package.json, puis pousser ce fichier avec la modification.
name: Livraison

on:
  push:
    branches: [main]
    paths: ['.github/workflows/etag.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lecture de la version a livrer
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
            echo "L'etiquette $TAG existe deja : version $VERSION deja livree."
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Installation des dependances
        if: steps.version.outputs.existe == 'false'
        run: npm install --no-audit --no-fund

      # v0.1.22 : le modele de langue de l'OCR voyage en base64 dans le
      # depot ; tests et construction attendent le vrai binaire decode.
      - name: Preparation du modele OCR (decodage base64)
        if: steps.version.outputs.existe == 'false'
        run: node scripts/preparer-ocr.js

      - name: Tests du moteur avant construction
        if: steps.version.outputs.existe == 'false'
        # En cas d'échec, l'extrait du journal est publié en annotation
        # (lisible sur la page publique des vérifications du commit).
        shell: bash
        run: |
          set +e
          sortie=$(npm test 2>&1)
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            extrait=$( { echo "$sortie" | tr -d '\r' | grep -A 14 'not ok' ; echo "$sortie" | tr -d '\r' | grep -E '^# (tests|pass|fail|cancelled)' ; } | tr '\n' '|' | sed 's/::/;/g' | head -c 14000 )
            extrait=${extrait//%/%25}
            total=${#extrait}
            i=0
            while [ "$i" -lt "$total" ] && [ "$i" -lt 13500 ]; do
              printf '::error::%s\n' "${extrait:$i:1500}"
              i=$((i+1500))
            done
            exit 1
          fi

      # v0.1.25 : le serveur OCR personnel est éprouvé avant construction :
      # son banc d'essai (bibliothèque standard seule, mode --banc) vérifie
      # le contrat /ocr, y compris le jeton (200/401) et la rétrocompatibilité.
      - uses: actions/setup-python@v5
        if: steps.version.outputs.existe == 'false'
        with:
          python-version: '3.12'

      - name: Test serveur OCR (mode banc)
        if: steps.version.outputs.existe == 'false'
        shell: bash
        run: python serveur-ocr/test_serveur.py

      - name: Construction de l'installateur et du portable
        if: steps.version.outputs.existe == 'false'
        run: npx electron-builder --win nsis portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verification de latest.yml (mise a jour automatique)
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/latest.yml")) {
            Write-Error "latest.yml absent : electron-builder n'a pas pu generer la configuration de mise a jour."
            exit 1
          }
          Get-Content dist/latest.yml

      # v0.1.3 : garde-fou de livraison. pdf.js est servi par le protocole
      # app:// depuis les ressources ; un fichier absent rend l'ouverture des
      # PDF impossible (v0.1.2). On refuse de publier sans ces fichiers.
      # v0.1.22 : idem pour l'OCR locale — tesseract.js (module + worker),
      # le coeur WASM (binaire embarque dans le .wasm.js, le script choisit
      # seul son variantes SIMD) et le modele de langue francais.
      # v0.1.24 : idem pour MathLive — la zone d'équation structurée
      # (dist/mathlive.min.mjs) et ses polices KaTeX (dist/fonts/).
      - name: Verification des ressources empaquetees (pdf.js, OCR)
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          foreach ($f in @(
            "dist/win-unpacked/resources/app.asar",
            "dist/win-unpacked/resources/node_modules/pdfjs-dist/build/pdf.min.mjs",
            "dist/win-unpacked/resources/node_modules/pdfjs-dist/build/pdf.worker.min.mjs",
            "dist/win-unpacked/resources/node_modules/tesseract.js/dist/tesseract.esm.min.js",
            "dist/win-unpacked/resources/node_modules/tesseract.js/dist/worker.min.js",
            "dist/win-unpacked/resources/node_modules/tesseract.js-core/tesseract-core-simd.wasm.js",
            "dist/win-unpacked/resources/node_modules/tesseract.js-core/tesseract-core.wasm.js",
            "dist/win-unpacked/resources/ocr/fra.traineddata.gz",
            "dist/win-unpacked/resources/node_modules/mathlive/dist/mathlive.min.mjs",
            "dist/win-unpacked/resources/node_modules/mathlive/dist/fonts/KaTeX_Main-Regular.woff2",
            "dist/win-unpacked/resources/node_modules/mathlive/dist/fonts/KaTeX_Math-Italic.woff2"
          )) {
            if (-not (Test-Path $f)) {
              Write-Error "Ressource absente du paquet Windows : $f"
              exit 1
            }
            Write-Host "OK : $f"
          }

      # v0.1.6 : garde-fou renforcé après l'erreur au démarrage du PORTABLE
      # v0.1.5 chez Arthur (« SyntaxError: Invalid or unexpected token »
      # dans un .js du paquet). On ne publie plus un exécutable non
      # vérifié : l'archive app.asar est extraite, la syntaxe de CHACUN de
      # nos fichiers JavaScript est contrôlée (CommonJS ou module selon le
      # fichier), et la charge du portable est comparée octet par octet à
      # celle de l'installateur. Les versions des dépendances sont
      # journalisées pour dépister une dérive entre deux constructions.
      - name: Verification du code empaquete (asar + portable)
        if: steps.version.outputs.existe == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # bash (pas pwsh) : le pwsh de GitHub interrompt le script au
          # premier message d'erreur standard de npm — cause de l'échec du
          # premier essai de cette étape sous pwsh.
          echo "=== Dependances retenues pour ce build ==="
          npm ls --depth=0 || echo "(arbre npm avec avis, non bloquant)"
          echo "=== Extraction de app.asar ==="
          npx --yes @electron/asar extract dist/win-unpacked/resources/app.asar app-extrait
          for f in main.js preload.js engine/*.js; do
            test -f "app-extrait/$f" || { echo "::error::Absent du paquet : $f"; exit 1; }
            node --check "app-extrait/$f" || { echo "::error::Syntaxe invalide dans $f"; exit 1; }
            echo "OK (CommonJS) : $f"
          done
          # Le rendu est un module ES : node --check exige .mjs.
          cp app-extrait/renderer/app.js app-extrait/renderer/app.mjs
          node --check app-extrait/renderer/app.mjs || { echo "::error::Syntaxe invalide dans renderer/app.js"; exit 1; }
          rm app-extrait/renderer/app.mjs
          echo "OK (module ES) : renderer/app.js"
          for f in renderer/index.html renderer/style.css; do
            test -f "app-extrait/$f" || { echo "::error::Absent du paquet : $f"; exit 1; }
            echo "OK : $f"
          done
          echo "=== Contenu du portable ==="
          # Le portable d'electron-builder est un conteneur NSIS qui renferme
          # une archive .7z : les fichiers ne sortent qu'apres la DEUXIEME
          # extraction (premier essai : app.asar reste introuvable).
          somme () { node -e "const c=require('crypto'),h=c.createHash('sha512');h.update(require('fs').readFileSync(process.argv[1]));console.log(h.digest('hex'))" "$1"; }
          rm -rf portable-enveloppe portable-charge
          if ! 7z x "dist/atelier-pdf-portable-$VERSION.exe" -oportable-enveloppe -y > /dev/null; then
            echo "::error::7z n'a pas pu ouvrir le conteneur du portable."; exit 1
          fi
          charge=$(find portable-enveloppe -type f -iname '*.7z' | head -1)
          if [ -n "$charge" ]; then
            if ! 7z x "$charge" -oportable-charge -y > /dev/null; then
              echo "::error::7z n'a pas pu extraire la charge interne du portable : $charge"; exit 1
            fi
            cheminPortable=$(find portable-charge -type f -name app.asar | head -1)
          else
            cheminPortable=$(find portable-enveloppe -type f -name app.asar | head -1)
          fi
          test -n "$cheminPortable" || { echo "::error::app.asar introuvable dans le portable meme apres double extraction."; exit 1; }
          shaUnpacked=$(somme dist/win-unpacked/resources/app.asar)
          shaPortable=$(somme "$cheminPortable")
          test "$shaUnpacked" = "$shaPortable" || { echo "::error::Le paquet portable differe de l'installateur (app.asar)."; exit 1; }
          echo "OK : portable et installateur portent le meme app.asar."

      # La page Release GitHub remplace les espaces par des points dans les
      # noms de fichiers : on aligne latest.yml sur ces noms rebelles.
      - name: Alignement des noms de latest.yml et des artefacts
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          $yaml = Get-Content dist/latest.yml -Raw
          $fichiers = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.yml' }
          foreach ($f in $fichiers) {
            $cible = $f.Name -replace ' ', '.'
            if ($cible -ne $f.Name) {
              Rename-Item $f.FullName $cible
            }
          }
          # Reecrire l'URL pointee par latest.yml vers le nom final.
          foreach ($f in (Get-ChildItem dist -Filter *.exe)) {
            $yaml = $yaml -replace [regex]::Escape($f.Name), ($f.Name -replace ' ', '.')
          }
          Set-Content dist/latest.yml $yaml
          Get-ChildItem dist -File

      - name: Pose de l'etiquette sur le sommet de main
        if: steps.version.outputs.existe == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Atelier PDF $VERSION"
          git push origin "$TAG"
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publication de la Release GitHub
        if: steps.version.outputs.existe == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
