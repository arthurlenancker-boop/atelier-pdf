# Livraison automatique : ce fichier, poussé sur main, construit et publie la
# version declare dans package.json (tag vX.Y.Z pose au passage si absent).
# Necessaire car ni le connecteur GitHub ni l'application mobile ne savent
# creer une etiquette, et l'ordinateur d'Arthur n'a pas npm. Les etiquettes
# posees par GITHUB_TOKEN ne declenchent pas d'autre flux (regle GitHub),
# d'ou un flux unique autonome qui enchaine tout.
# Attention : ce flux se declenche a CHAQUE modification de ce fichier.
# Declencheur de la v0.1.30 : onglets et « enregistrer avant la
# fermeture ». Chaque PDF ouvert vit dans son onglet (bande sous la
# barre du haut : clic = bascule, croix = fermeture, Ctrl+W = fermer
# l'onglet actif) ; l'etat complet de chaque document (session pdf-lib,
# journal des gestes, drapeau modifie) demeure dans le processus
# principal (Map des onglets, pdf:active bascule le pointeur), le
# rendu reaffiche depuis le resume et garde par onglet sa vue (page,
# zoom, mots reconnus). Ouvrir un fichier deja present REACTIVE son
# onglet, jamais un second exemplaire. La croix d'onglet, la croix de
# fenetre, Alt+F4 et Quitter demandent tous (boite native
# Enregistrer / Fermer sans enregistrer / Annuler) AVANT de perder un
# document modifie ; Corps en colonne flexible (lecon v0.1.16 : la
# bande d'onglets ne decale plus jamais la zone de travail).
# Declencheur de la v0.1.31 : annotations riches validees sur maquette
# canvas par Arthur (croquis couleurs, formes et traitement de texte).
# Chaque outil Surligner, Encadrer et Ecrire ouvre son panneau d'options
# a gauche de la page : Surligner gagne quatre formes (/Highlight plein,
# /Underline soulignement, /StrikeOut barre, /Squiggly onde) et huit
# couleurs ; Encadrer quatre formes (rectangle, arrondi, ellipse, nuage
# /Cloudy), trois traits (continu, tirets [7 5], points [0.2 6]), trois
# epaisseurs (1.3 / 2.2 / 3.4 pt), remplissage teinte a 13 % et sept
# couleurs ; Ecrire devient machine a ecrire riche — taille de corps
# 8 a 36 pt, gras, italique, souligne, barre, exposant, indice, couleur
# du texte et de fond (opacite 0.6), alignements, listes a puces et
# numeros, formules $...$ composees par MathJax. Chaque palette offre
# le cercle chromatique HSV pour les couleurs personnalisees
# (engine/couleurs.js). Le texte riche se compose par engine/markup.js
# et se pose par engine/riche.js (/FreeText, marqueur « Note riche
# taille : ») ; les cadres portent leur forme dans le /Subject (« Cadre
# forme,trait,epaisseur[,teinte] ») et l'apparence est genere par
# engine/annots.js ; le deplacement et le redimensionnement (poignee
# bas-droite) reposent la note ou le cadre a l'identique
# (engine/bouger.js ; le rendu ecran suit dans renderer/app.js,
# options dans renderer/index.html et style dans renderer/style.css).
# L'outil Trait (encre) reste hors du panneau d'options.
# Relance 1 (apres echec CI des tests moteur) : l'opcode c prend SIX
# nombres (SEPT mots) — translaterLigne comptait huit nombres, d'ou des
# cubiques d'ellipse jamais translatees ; le test riche eprouve /Gf avec
# un vrai fond coloré dans sa source (l'ancienne source n'en avait pas).
# Declencheur de la v0.1.29 : page reconnue editable en place (geste
# valide sur maquette canvas par Arthur). Les blocs reconnus de la page
# affichee apparaissent en contour discret a l'outil Selection ; un clic
# ouvre la correction EXACTEMENT a sa place, preremplie du texte reconnu,
# a la taille estimee du bloc (les formules en LaTeX $...$, composees
# par le moteur d'equations). A l'enregistrement, engine/correction.js
# COUVRE le scan du bloc d'un rectangle blanc opaque et ecrit le texte
# vectoriel standard (engine/texte.js porte le marqueur Correction OCR ;
# engine/bouger.js repose la correction au redimensionnement ; le bouton
# Reco masque l'apercu pour saisir les annotations posees).
# Declencheur de la v0.1.28 : barre de progression de la reconnaissance
# du document a l'ouverture (styles A et D valides par Arthur sur la
# maquette canvas : barre fine sous la barre d'outils, navette pendant
# le chargement du moteur, etats des vignettes, lien Arreter discret),
# reconnaissance sequentielle par le chemin central page:tester, pages
# reconnues gardees en memoire (rien n'ecrit dans le PDF). Correctifs
# approuves livres ensemble : refus de https:// sur un hote local
# (estHttpsLocal + message clair dans la carte des options), aide
# « un document doit etre ouvert » dans la carte, styles propres au
# bloc #essai-page, silence des reinitialisations de connexion
# (WinError 10054) du serveur OCR, test_moteur_pages.py dans la CI.
# Historique v0.1.27 : remise en coherence apres croisement de deux
# flux le meme matin (correctifs Equation prepare sur une base v0.1.24
# pendant que main avancait : restauration des quatre fichiers ecrases,
# garde-fous de livraison retrouves, version 0.1.27 ; les versions
# 0.1.25 et 0.1.26 etaient restees livrees par le flux serveur).
# Pour livrer une nouvelle version : incrementer "version" dans
# package.json, puis pousser ce fichier avec la modification.
name: Livraison

on:
  push:
    branches: [main]
    paths: ['.github/workflows/etag.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lecture de la version a livrer
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
            echo "L'etiquette $TAG existe deja : version $VERSION deja livree."
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Installation des dependances
        if: steps.version.outputs.existe == 'false'
        run: npm install --no-audit --no-fund

      # v0.1.22 : le modele de langue de l'OCR voyage en base64 dans le
      # depot ; tests et construction attendent le vrai binaire decode.
      - name: Preparation du modele OCR (decodage base64)
        if: steps.version.outputs.existe == 'false'
        run: node scripts/preparer-ocr.js

      - name: Tests du moteur avant construction
        if: steps.version.outputs.existe == 'false'
        # En cas d'échec, l'extrait du journal est publié en annotation
        # (lisible sur la page publique des vérifications du commit).
        shell: bash
        run: |
          set +e
          sortie=$(npm test 2>&1)
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            extrait=$( { echo "$sortie" | tr -d '\r' | grep -A 14 'not ok' ; echo "$sortie" | tr -d '\r' | grep -E '^# (tests|pass|fail|cancelled)' ; } | tr '\n' '|' | sed 's/::/;/g' | head -c 14000 )
            extrait=${extrait//%/%25}
            total=${#extrait}
            i=0
            while [ "$i" -lt "$total" ] && [ "$i" -lt 13500 ]; do
              printf '::error::%s\n' "${extrait:$i:1500}"
              i=$((i+1500))
            done
            exit 1
          fi

      # v0.1.25 : le serveur OCR personnel est éprouvé avant construction :
      # son banc d'essai (bibliothèque standard seule, mode --banc) vérifie
      # le contrat /ocr, y compris le jeton (200/401) et la rétrocompatibilité.
      - uses: actions/setup-python@v5
        if: steps.version.outputs.existe == 'false'
        with:
          python-version: '3.12'

      - name: Test serveur OCR (mode banc)
        if: steps.version.outputs.existe == 'false'
        shell: bash
        run: python serveur-ocr/test_serveur.py

      - name: Construction de l'installateur et du portable
        if: steps.version.outputs.existe == 'false'
        run: npx electron-builder --win nsis portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verification de latest.yml (mise a jour automatique)
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/latest.yml")) {
            Write-Error "latest.yml absent : electron-builder n'a pas pu generer la configuration de mise a jour."
            exit 1
          }
          Get-Content dist/latest.yml

      # v0.1.3 : garde-fou de livraison. pdf.js est servi par le protocole
      # app:// depuis les ressources ; un fichier absent rend l'ouverture des
      # PDF impossible (v0.1.2). On refuse de publier sans ces fichiers.
      # v0.1.22 : idem pour l'OCR locale — tesseract.js (module + worker),
      # le coeur WASM (binaire embarque dans le .wasm.js, le script choisit
      # seul son variantes SIMD) et le modele de langue francais.
      # v0.1.24 : idem pour MathLive — la zone d'équation structurée
      # (dist/mathlive.min.mjs) et ses polices KaTeX (dist/fonts/).
      - name: Verification des ressources empaquetees (pdf.js, OCR)
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          foreach ($f in @(
            "dist/win-unpacked/resources/app.asar",
            "dist/win-unpacked/resources/node_modules/pdfjs-dist/build/pdf.min.mjs",
            "dist/win-unpacked/resources/node_modules/pdfjs-dist/build/pdf.worker.min.mjs",
            "dist/win-unpacked/resources/node_modules/tesseract.js/dist/tesseract.esm.min.js",
            "dist/win-unpacked/resources/node_modules/tesseract.js/dist/worker.min.js",
            "dist/win-unpacked/resources/node_modules/tesseract.js-core/tesseract-core-simd.wasm.js",
            "dist/win-unpacked/resources/node_modules/tesseract.js-core/tesseract-core.wasm.js",
            "dist/win-unpacked/resources/ocr/fra.traineddata.gz",
            "dist/win-unpacked/resources/node_modules/mathlive/dist/mathlive.min.mjs",
            "dist/win-unpacked/resources/node_modules/mathlive/dist/fonts/KaTeX_Main-Regular.woff2",
            "dist/win-unpacked/resources/node_modules/mathlive/dist/fonts/KaTeX_Math-Italic.woff2"
          )) {
            if (-not (Test-Path $f)) {
              Write-Error "Ressource absente du paquet Windows : $f"
              exit 1
            }
            Write-Host "OK : $f"
          }

      # v0.1.6 : garde-fou renforcé après l'erreur au démarrage du PORTABLE
      # v0.1.5 chez Arthur (« SyntaxError: Invalid or unexpected token »
      # dans un .js du paquet). On ne publie plus un exécutable non
      # vérifié : l'archive app.asar est extraite, la syntaxe de CHACUN de
      # nos fichiers JavaScript est contrôlée (CommonJS ou module selon le
      # fichier), et la charge du portable est comparée octet par octet à
      # celle de l'installateur. Les versions des dépendances sont
      # journalisées pour dépister une dérive entre deux constructions.
      - name: Verification du code empaquete (asar + portable)
        if: steps.version.outputs.existe == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # bash (pas pwsh) : le pwsh de GitHub interrompt le script au
          # premier message d'erreur standard de npm — cause de l'échec du
          # premier essai de cette étape sous pwsh.
          echo "=== Dependances retenues pour ce build ==="
          npm ls --depth=0 || echo "(arbre npm avec avis, non bloquant)"
          echo "=== Extraction de app.asar ==="
          npx --yes @electron/asar extract dist/win-unpacked/resources/app.asar app-extrait
          for f in main.js preload.js engine/*.js; do
            test -f "app-extrait/$f" || { echo "::error::Absent du paquet : $f"; exit 1; }
            node --check "app-extrait/$f" || { echo "::error::Syntaxe invalide dans $f"; exit 1; }
            echo "OK (CommonJS) : $f"
          done
          # Le rendu est un module ES : node --check exige .mjs.
          cp app-extrait/renderer/app.js app-extrait/renderer/app.mjs
          node --check app-extrait/renderer/app.mjs || { echo "::error::Syntaxe invalide dans renderer/app.js"; exit 1; }
          rm app-extrait/renderer/app.mjs
          echo "OK (module ES) : renderer/app.js"
          for f in renderer/index.html renderer/style.css; do
            test -f "app-extrait/$f" || { echo "::error::Absent du paquet : $f"; exit 1; }
            echo "OK : $f"
          done
          echo "=== Contenu du portable ==="
          # Le portable d'electron-builder est un conteneur NSIS qui renferme
          # une archive .7z : les fichiers ne sortent qu'apres la DEUXIEME
          # extraction (premier essai : app.asar reste introuvable).
          somme () { node -e "const c=require('crypto'),h=c.createHash('sha512');h.update(require('fs').readFileSync(process.argv[1]));console.log(h.digest('hex'))" "$1"; }
          rm -rf portable-enveloppe portable-charge
          if ! 7z x "dist/atelier-pdf-portable-$VERSION.exe" -oportable-enveloppe -y > /dev/null; then
            echo "::error::7z n'a pas pu ouvrir le conteneur du portable."; exit 1
          fi
          charge=$(find portable-enveloppe -type f -iname '*.7z' | head -1)
          if [ -n "$charge" ]; then
            if ! 7z x "$charge" -oportable-charge -y > /dev/null; then
              echo "::error::7z n'a pas pu extraire la charge interne du portable : $charge"; exit 1
            fi
            cheminPortable=$(find portable-charge -type f -name app.asar | head -1)
          else
            cheminPortable=$(find portable-enveloppe -type f -name app.asar | head -1)
          fi
          test -n "$cheminPortable" || { echo "::error::app.asar introuvable dans le portable meme apres double extraction."; exit 1; }
          shaUnpacked=$(somme dist/win-unpacked/resources/app.asar)
          shaPortable=$(somme "$cheminPortable")
          test "$shaUnpacked" = "$shaPortable" || { echo "::error::Le paquet portable differe de l'installateur (app.asar)."; exit 1; }
          echo "OK : portable et installateur portent le meme app.asar."

      # La page Release GitHub remplace les espaces par des points dans les
      # noms de fichiers : on aligne latest.yml sur ces noms rebelles.
      - name: Alignement des noms de latest.yml et des artefacts
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          $yaml = Get-Content dist/latest.yml -Raw
          $fichiers = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.yml' }
          foreach ($f in $fichiers) {
            $cible = $f.Name -replace ' ', '.'
            if ($cible -ne $f.Name) {
              Rename-Item $f.FullName $cible
            }
          }
          # Reecrire l'URL pointee par latest.yml vers le nom final.
          foreach ($f in (Get-ChildItem dist -Filter *.exe)) {
            $yaml = $yaml -replace [regex]::Escape($f.Name), ($f.Name -replace ' ', '.')
          }
          Set-Content dist/latest.yml $yaml
          Get-ChildItem dist -File

      - name: Pose de l'etiquette sur le sommet de main
        if: steps.version.outputs.existe == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Atelier PDF $VERSION"
          git push origin "$TAG"
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publication de la Release GitHub
        if: steps.version.outputs.existe == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
