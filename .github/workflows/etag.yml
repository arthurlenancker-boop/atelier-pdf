# Livraison automatique : ce fichier, poussé sur main, construit et publie la
# versiondeclare dans package.json (tag vX.Y.Z pose au passage si absent).
# Necessaire car ni le connecteur GitHub ni l'application mobile ne savent
# creer une etiquette, et l'ordinateur d'Arthur n'a pas npm. Les etiquettes
# posees par GITHUB_TOKEN ne declenchent pas d'autre flux (regle GitHub),
# d'ou un flux unique autonome qui enchaine tout.
# Attention : ce flux se declenche a CHAQUE modification de ce fichier.
# Declencheur de la v0.1.6 : zoom fluide (transformation CSS pendant le
# geste, pivot au pointeur, un seul rendu net — plus de rendus pdf.js
# concurrents, cause de la page vide et des annotations disparues),
# texte des commentaires affiché dans l'application, et garde-fou
# nouveau : syntaxe du code empaqueté vérifiée (asar extrait + node
# --check, portable comparé à l'installateur octet par octet) après
# l'erreur au démarrage du portable v0.1.5.
# Pour livrer une nouvelle version : incrementer "version" dans
# package.json, puis pousser ce fichier avec la modification.
name: Livraison

on:
  push:
    branches: [main]
    paths: ['.github/workflows/etag.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lecture de la version a livrer
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
            echo "L'etiquette $TAG existe deja : version $VERSION deja livree."
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Installation des dependances
        if: steps.version.outputs.existe == 'false'
        run: npm install --no-audit --no-fund

      - name: Tests du moteur avant construction
        if: steps.version.outputs.existe == 'false'
        run: npm test

      - name: Construction de l'installateur et du portable
        if: steps.version.outputs.existe == 'false'
        run: npx electron-builder --win nsis portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verification de latest.yml (mise a jour automatique)
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/latest.yml")) {
            Write-Error "latest.yml absent : electron-builder n'a pas pu generer la configuration de mise a jour."
            exit 1
          }
          Get-Content dist/latest.yml

      # v0.1.3 : garde-fou de livraison. pdf.js est servi par le protocole
      # app:// depuis les ressources ; un fichier absent rend l'ouverture des
      # PDF impossible (v0.1.2). On refuse de publier sans ces fichiers.
      - name: Verification des ressources empaquetees (pdf.js)
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          foreach ($f in @(
            "dist/win-unpacked/resources/app.asar",
            "dist/win-unpacked/resources/node_modules/pdfjs-dist/build/pdf.min.mjs",
            "dist/win-unpacked/resources/node_modules/pdfjs-dist/build/pdf.worker.min.mjs"
          )) {
            if (-not (Test-Path $f)) {
              Write-Error "Ressource absente du paquet Windows : $f"
              exit 1
            }
            Write-Host "OK : $f"
          }

      # v0.1.6 : garde-fou renforcé après l'erreur au démarrage du PORTABLE
      # v0.1.5 chez Arthur (« SyntaxError: Invalid or unexpected token »
      # dans un .js du paquet). On ne publie plus un exécutable non
      # vérifié : l'archive app.asar est extraite, la syntaxe de CHACUN de
      # nos fichiers JavaScript est contrôlée (CommonJS ou module selon le
      # fichier), et la charge du portable est comparée octet par octet à
      # celle de l'installateur. Les versions des dépendances sont
      # journalisées pour dépister une dérive entre deux constructions.
      - name: Verification du code empaquete (asar + portable)
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Write-Host "=== Dependances retenues pour ce build ==="
          npm ls --depth=0
          if ($LASTEXITCODE -ne 0) { Write-Error "Arbre de dependances incomplet."; exit 1 }
          Write-Host "=== Extraction de app.asar ==="
          npx --yes @electron/asar extract dist/win-unpacked/resources/app.asar app-extrait
          if ($LASTEXITCODE -ne 0) { Write-Error "app.asar illisible."; exit 1 }
          $cjs = @(
            "main.js", "preload.js",
            "engine/annotcore.js", "engine/annots.js", "engine/coords.js",
            "engine/equation.js", "engine/guides.js", "engine/mjrender.js",
            "engine/pdfio.js", "engine/reread.js", "engine/session.js"
          )
          foreach ($f in $cjs) {
            if (-not (Test-Path "app-extrait/$f")) { Write-Error "Absent du paquet : $f"; exit 1 }
            node --check "app-extrait/$f"
            if ($LASTEXITCODE -ne 0) { Write-Error "Syntaxe invalide dans $f"; exit 1 }
            Write-Host "OK (CommonJS) : $f"
          }
          # Le rendu est un module ES : node --check exige .mjs.
          Copy-Item app-extrait/renderer/app.js app-extrait/renderer/app.mjs -Force
          node --check app-extrait/renderer/app.mjs
          if ($LASTEXITCODE -ne 0) { Write-Error "Syntaxe invalide dans renderer/app.js"; exit 1 }
          Write-Host "OK (module ES) : renderer/app.js"
          Remove-Item app-extrait/renderer/app.mjs
          foreach ($f in @("renderer/index.html", "renderer/style.css")) {
            if (-not (Test-Path "app-extrait/$f")) { Write-Error "Absent du paquet : $f"; exit 1 }
            Write-Host "OK : $f"
          }
          Write-Host "=== Contenu du portable ==="
          7z x "dist/atelier-pdf-portable-$env:VERSION.exe" -oportable-extrait -y | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "Portable illisible."; exit 1 }
          $shaInstallateur = (Get-FileHash dist/win-unpacked/resources/app.asar -Algorithm SHA512).Hash
          $asarPortable = Get-ChildItem portable-extrait -Recurse -Filter app.asar | Select-Object -First 1
          if (-not $asarPortable) { Write-Error "app.asar introuvable dans le portable."; exit 1 }
          $shaPortable = (Get-FileHash $asarPortable.FullName -Algorithm SHA512).Hash
          if ($shaInstallateur -ne $shaPortable) {
            Write-Error "Le paquet portable differe de l'installateur (app.asar)."
            exit 1
          }
          Write-Host "OK : portable et installateur portent le meme app.asar."

      # La page Release GitHub remplace les espaces par des points dans les
      # noms de fichiers : on aligne latest.yml sur ces noms rebelles.
      - name: Alignement des noms de latest.yml et des artefacts
        if: steps.version.outputs.existe == 'false'
        shell: pwsh
        run: |
          $yaml = Get-Content dist/latest.yml -Raw
          $fichiers = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.yml' }
          foreach ($f in $fichiers) {
            $cible = $f.Name -replace ' ', '.'
            if ($cible -ne $f.Name) {
              Rename-Item $f.FullName $cible
            }
          }
          # Reecrire l'URL pointee par latest.yml vers le nom final.
          foreach ($f in (Get-ChildItem dist -Filter *.exe)) {
            $yaml = $yaml -replace [regex]::Escape($f.Name), ($f.Name -replace ' ', '.')
          }
          Set-Content dist/latest.yml $yaml
          Get-ChildItem dist -File

      - name: Pose de l'etiquette sur le sommet de main
        if: steps.version.outputs.existe == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Atelier PDF $VERSION"
          git push origin "$TAG"
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publication de la Release GitHub
        if: steps.version.outputs.existe == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
